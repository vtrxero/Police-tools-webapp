# ============================================
# Compila el APK de Android
#
# El SDK de Android no se puede descargar desde el entorno de desarrollo
# (dl.google.com esta bloqueado por politica de red), pero los runners de
# GitHub ya lo traen instalado, asi que el APK se compila aqui.
#
# Y se publica en una release con la etiqueta fija 'apk-latest', que da un
# enlace directo y siempre el mismo:
#
#   https://github.com/vtrxero/Police-tools-webapp/releases/download/apk-latest/PoliceTools.apk
#
# El artefacto de Actions no sirve para instalar desde el telefono: viene
# comprimido en un zip y su descarga exige estar identificado en GitHub. Se
# mantiene de todas formas, que para revisar una compilacion vieja va bien.
# ============================================
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Compilar tambien el APK de release firmado'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Publicar la release necesita permiso de escritura sobre el repositorio
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Dependencias
        run: npm ci || npm install

      - name: Preparar www y sincronizar
        run: |
          npm run build
          npx cap sync android

      # Comprueba que todo lo que la app necesita acabo dentro del APK.
      # Sin esto, un fallo al copiar da un APK que instala y arranca en
      # blanco, que es peor que un fallo de compilacion.
      - name: Verificar contenido
        run: |
          A=android/app/src/main/assets/public
          for f in index.html js/app.js js/lock.js js/pdf-generator.js \
                   js/file-out.js js/pdf-view.js \
                   css/styles.css vendor/pdf-lib.min.js \
                   vendor/pdf.min.mjs vendor/pdf.worker.min.mjs \
                   vendor/pdfjs-fonts/LiberationSans-Regular.ttf \
                   "pdf-templates/patrol_log.pdf" "pdf-templates/PMCS Explorer.pdf"; do
            if [ ! -f "$A/$f" ]; then echo "FALTA: $f"; exit 1; fi
          done
          # Los plugins nativos tienen que haber entrado en el proyecto Gradle:
          # sin ellos descargar y compartir vuelven a no hacer nada.
          for p in capacitor-filesystem capacitor-share; do
            if ! grep -q "$p" android/capacitor.settings.gradle; then
              echo "FALTA el plugin: $p"; exit 1
            fi
          done
          echo "Contenido verificado: $(find $A -type f | wc -l) archivos, $(du -sh $A | cut -f1)"

      - name: Compilar debug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      # La firma tiene que ser siempre la misma clave versionada. Si Gradle
      # vuelve a generarse una propia, el APK deja de instalarse encima del
      # anterior y hay que desinstalar, perdiendo los reportes. Mejor que
      # falle la compilacion que enterarse en el telefono.
      - name: Verificar la firma
        run: |
          ESPERADA=$(keytool -list -v -keystore android/app/debug.keystore \
                       -storepass android 2>/dev/null \
                     | grep 'SHA256:' | head -1 | tr -d '[:space:]')
          OBTENIDA=$(keytool -printcert -jarfile \
                       android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null \
                     | grep 'SHA256:' | head -1 | tr -d '[:space:]')
          echo "esperada: $ESPERADA"
          echo "obtenida: $OBTENIDA"
          if [ -z "$OBTENIDA" ] || [ "$ESPERADA" != "$OBTENIDA" ]; then
            echo "El APK no esta firmado con android/app/debug.keystore"
            exit 1
          fi

      - name: Renombrar
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/PoliceTools-debug-$(git rev-parse --short HEAD).apk"
          ls -lh out/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PoliceTools-debug-apk
          path: out/*.apk
          retention-days: 60

      # El APK que se instala en el telefono, con enlace fijo. La etiqueta se
      # reutiliza a proposito: asi el enlace de descarga no cambia nunca y no
      # hay que buscar cual es la ultima version.
      - name: Publicar release descargable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk out/PoliceTools.apk
          SHA=$(git rev-parse --short HEAD)
          TAM=$(du -h out/PoliceTools.apk | cut -f1)

          cat > notas.md <<NOTAS
          APK de Police Tools — compilado de \`$SHA\` ($TAM).

          **Instalar:** abre este enlace desde el telefono y toca
          \`PoliceTools.apk\`. Android va a pedir permiso para instalar desde
          esta fuente; es normal en una app que no viene de Play Store.
          Se instala encima de la anterior y **conserva los reportes**.

          Ultimo cambio: $(git log -1 --pretty=%s)
          NOTAS

          # La API de GitHub devuelve 503 de vez en cuando y tiraba el build
          # entero con el APK ya compilado. Se reintenta antes de rendirse.
          reintentar() {
            for intento in 1 2 3 4; do
              if "$@"; then return 0; fi
              echo "Intento $intento fallido, se reintenta en $((intento * 10))s"
              sleep $((intento * 10))
            done
            echo "No se pudo publicar la release despues de 4 intentos"
            return 1
          }

          # --clobber reemplaza el fichero si la release ya existe
          if gh release view apk-latest >/dev/null 2>&1; then
            reintentar gh release edit apk-latest --notes-file notas.md --target "$GITHUB_SHA"
            reintentar gh release upload apk-latest out/PoliceTools.apk --clobber
          else
            reintentar gh release create apk-latest out/PoliceTools.apk \
              --title "Police Tools — ultimo APK" \
              --notes-file notas.md \
              --target "$GITHUB_SHA"
          fi

          echo "Descarga: https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/PoliceTools.apk"

      # El APK de release necesita una clave de firma. Se guarda en
      # Settings -> Secrets como KEYSTORE_BASE64, y las contraseñas aparte.
      - name: Compilar release firmado
        if: github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/PoliceTools-$(git rev-parse --short HEAD).apk"

      - name: Subir APK firmado
        if: github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: PoliceTools-release-apk
          path: out/PoliceTools-*.apk
          retention-days: 90
