apply plugin: 'com.android.application'

// Numero de version. En CI sale del historial de git; el valor por
// defecto es para compilar en local sin pasar la variable.
def ptVersionCode = (System.getenv("PT_VERSION_CODE") ?: "3") as Integer

android {
    namespace "mil.buchanan.policetools"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "mil.buchanan.policetools"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // El numero de version sale del historial de git, asi que cada
        // compilacion es mayor que la anterior y Android la trata como una
        // actualizacion de verdad. Con un versionCode fijo, todos los APK
        // publicados tenian el mismo numero: se instalaban igual, pero el
        // instalador no podia distinguir una version nueva de una reinstalacion.
        //
        // El valor va por una variable y no en linea: escrito como
        // `versionCode (expr).toInteger()`, Groovy lee la llamada al metodo
        // primero y aplica .toInteger() al valor que devuelve —que es null—,
        // asi que la compilacion moria con "Value is null".
        versionCode ptVersionCode
        versionName System.getenv("PT_VERSION_NAME") ?: "2.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clave de firma fija, versionada con el proyecto.
    //
    // Sin esto Gradle genera un debug.keystore en la maquina que compila, y
    // cada ejecucion del workflow arranca con un runner limpio: cada APK
    // salia firmado con una clave distinta. Android trata dos APKs con firmas
    // distintas como aplicaciones ajenas y se niega a instalar uno sobre el
    // otro ("App not installed"), asi que actualizar obligaba a desinstalar
    // primero — y desinstalar borra los reportes.
    //
    // Con la clave en el repositorio todas las compilaciones firman igual y
    // las actualizaciones entran encima conservando los datos.
    //
    // La contrapartida: la clave es publica, asi que no acredita quien
    // construyo el APK. Para eso esta la firma de release, cuya clave vive en
    // los secrets del repositorio (KEYSTORE_BASE64) y no aqui.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
